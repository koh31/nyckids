<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Kids Go</title>

<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

<header class="wrap header">
  <h1>NYC Kids Go</h1>
</header>

<section class="hero wrap">
  <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" class="hero-img">
  <div>
    <h2>Find fun events for kids in NYC</h2>
    <p>週末のおでかけをすぐ見つけよう</p>
  </div>
</section>

<section class="wrap filters">
  <select id="ageFilter">
    <option value="">All Ages</option>
    <option value="Toddler">Toddler</option>
    <option value="Kids">Kids</option>
    <option value="Teens">Teens</option>
  </select>

  <select id="genreFilter">
    <option value="">All Genres</option>
    <option value="Art">Art</option>
    <option value="Music">Music</option>
    <option value="Outdoor">Outdoor</option>
  </select>
</section>

<section class="wrap">
  <h2>🔥 Recommended</h2>
  <div id="featuredList" class="grid"></div>
</section>

<section class="wrap">
  <h2>All Events</h2>
  <div id="eventsGrid" class="grid"></div>
</section>

<section class="wrap">
  <h2>📬 Weekly Picks</h2>
  <form action="https://buttondown.email/api/emails/embed-subscribe/YOUR_ID" method="post">
    <input type="email" name="email" placeholder="Enter email">
    <button>Subscribe</button>
  </form>
</section>

<script src="app.js"></script>

</body>
</html>
