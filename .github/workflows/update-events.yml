
name: Update NYC Kids events

on:
  schedule:
    - cron: "15 10 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/update_events.py

      - name: Commit event updates
        run: |
          git config user.name "nyc-kids-go-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "Update events"
          git push
